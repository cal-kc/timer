<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Timer Controller</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --muted:#94a3b8;
    --blue:#3b82f6; --red:#ef4444; --green:#22c55e; --digital:"Digital-7","Digital-7 Mono",Consolas,"Courier New",monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:#fff; height:100%;
    font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; }
  body { max-width:560px; margin:0 auto; overflow:hidden; }
  #app { height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px 0; }
  #app[hidden] { display:none; }
  #top { flex:none; background:var(--bg); padding-bottom:4px; border-bottom:1px solid var(--border); }
  #scroll { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:12px 0 calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }
  #blocks { display:flex; gap:8px; margin-bottom:10px; }
  #blocks button { flex:1; height:44px; background:#334155; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px; }
  #blocks button.on { background:var(--blue); }
  button { font:inherit; color:#fff; border:0; cursor:pointer; border-radius:10px; touch-action:manipulation; }
  button:active { filter:brightness(.85); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  header { display:flex; align-items:center; gap:8px; padding:10px 0; }
  #dot { width:12px; height:12px; border-radius:50%; background:var(--red); flex:none; }
  #dot.ok { background:var(--green); }
  #code { font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { background:var(--panel); padding:8px 12px; font-size:13px; }

  #master { width:100%; height:60px; font-size:20px; font-weight:700; background:var(--blue); margin-bottom:10px; }
  #master.stop { background:var(--red); }

  .t { border-radius:14px; padding:14px; margin-bottom:12px; border:2px solid var(--border); }
  .t.running { border-color:var(--green); }
  .t-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .t-title { font-weight:700; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t-state { font-size:12px; opacity:.75; flex:none; }
  .time { font-family:var(--digital); font-weight:700; text-align:center; font-size:min(30vw,150px); line-height:1.05; padding:6px 0 10px;
    font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; }
  .row > button { flex:1; height:54px; font-size:17px; font-weight:700; background:rgba(0,0,0,.35); }
  .row > .go { background:var(--blue); flex:2; }
  .row > .go.run { background:var(--red); }
  .adj { margin-top:8px; }
  .adj > button { height:42px; font-size:15px; font-weight:600; }
  .more { margin-top:8px; width:100%; height:38px; background:transparent; color:inherit; opacity:.75; font-size:13px; }
  .edit { display:none; margin-top:8px; background:rgba(0,0,0,.35); border-radius:10px; padding:12px; }
  .edit.open { display:block; }
  .edit label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  .edit label:first-child { margin-top:0; }
  .edit input { width:100%; background:var(--bg); color:#fff; border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; font-size:16px; }
  .edit .tm { display:flex; gap:8px; align-items:center; }
  .edit .apply { width:100%; height:46px; margin-top:12px; background:var(--blue); font-weight:700; }

  #count { display:flex; gap:8px; align-items:center; margin:0 0 6px; }
  #count span { color:var(--muted); font-size:13px; margin-right:auto; }
  #count button { width:56px; height:44px; background:var(--panel); font-weight:700; }
  #count button.on { background:var(--blue); }

  #join { position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; padding:16px; }
  #join.open { display:flex; }
  #join form { background:var(--panel); padding:24px; border-radius:14px; width:100%; max-width:380px; }
  #join h1 { margin:0 0 6px; font-size:22px; }
  #join p { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.5; }
  #join input { width:100%; background:var(--bg); color:#fff; border:1px solid var(--border); padding:12px; border-radius:8px; font:inherit; font-size:18px; }
  #join button { width:100%; height:50px; margin-top:12px; background:var(--blue); font-weight:700; font-size:17px; }
  #err { color:#fca5a5; font-size:13px; min-height:18px; margin-top:8px; }
  #wait { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
  <div id="app" hidden>
    <div id="top">
      <header id="hdr">
        <span id="dot" title="Connection status"></span>
        <span id="code"></span>
        <button class="chip" id="leave">Leave</button>
      </header>
      <div id="blocks"></div>
      <button id="master">▶ START SELECTED</button>
      <div id="count"><span>Timers shown</span></div>
    </div>
    <main id="scroll">
      <div id="list"></div>
      <div id="wait" hidden>Waiting for the session…</div>
    </main>
  </div>

  <div id="join">
    <form id="joinForm">
      <h1>Timer controller</h1>
      <p>Enter the same session code used on the timer display.</p>
      <input id="codeIn" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. PTCG-7392" aria-label="Session code">
      <div id="err"></div>
      <button type="submit">Join session</button>
    </form>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCY1rLVqejcTKBP7rtVGGanlL8tuIie9L0",
  authDomain: "remote-timer-992b7.firebaseapp.com",
  databaseURL: "https://remote-timer-992b7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "remote-timer-992b7",
  storageBucket: "remote-timer-992b7.firebasestorage.app",
  messagingSenderId: "661715221705",
  appId: "1:661715221705:web:28d63c697c69ab29e52118"
};
const db = getDatabase(initializeApp(firebaseConfig));

const MAX = 99 * 60 + 59;
const SESSION_KEY = "tournament_timer_session";
const CODE_RE = /^[A-Za-z0-9_-]{3,32}$/;
const $ = (s) => document.querySelector(s);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const buzz = () => { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} };

const S = { code: null, offset: 0, unsubs: [], data: null, cards: [], count: 0, sel: [true, true, true], blocks: [] };
const serverNow = () => Date.now() + S.offset;

function compute(t) {
  const base = clamp(Number(t.base_seconds) || 0, 0, MAX);
  if (!t.running) return { total: base, over: !!t.base_overtime };
  const e = Math.max(0, Math.floor((serverNow() - (Number(t.started_at) || 0)) / 1000));
  if (t.base_overtime) return { total: Math.min(MAX, base + e), over: true };
  if (e <= base) return { total: base - e, over: false };
  return { total: Math.min(MAX, e - base), over: true };
}

function write(patches, extra) {
  if (!S.code) return;
  const u = {};
  for (const [i, p] of Object.entries(patches)) {
    if (!p) continue;
    for (const [k, v] of Object.entries(p)) u[`timers/${i}/${k}`] = v;
  }
  Object.assign(u, extra || {});
  if (Object.keys(u).length) update(ref(db, "sessions/" + S.code), u);
}

const timerAt = (i) => (S.data && S.data.timers && S.data.timers[i]) || {};
function togglePatch(t) {
  const c = compute(t);
  return t.running
    ? { running: false, started_at: null, base_seconds: c.total, base_overtime: c.over }
    : { running: true, started_at: serverNow(), base_seconds: c.total, base_overtime: c.over };
}
function resetPatch(t) {
  const r = clamp(Number(t.reset_seconds) || 0, 0, MAX);
  return { running: false, started_at: null, base_seconds: r, base_overtime: false };
}
function adjustPatch(t, delta) {
  const c = compute(t);
  if (c.over) return null; // only adjust while counting down
  const total = clamp(c.total + delta, 0, MAX);
  return { running: !!t.running, started_at: t.running ? serverNow() : null, base_seconds: total, base_overtime: false };
}

const fmt = (n) => String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");

function buildCard(i) {
  const el = document.createElement("div");
  el.className = "t";
  el.innerHTML = `
    <div class="t-head"><div class="t-title"></div><div class="t-state"></div></div>
    <div class="time"></div>
    <div class="row"><button class="reset">↺ Reset</button><button class="go">▶ Start</button></div>
    <div class="row adj"><button data-d="-60">−1:00</button><button data-d="-10">−0:10</button><button data-d="10">+0:10</button><button data-d="60">+1:00</button></div>
    <button class="more">Edit title &amp; time</button>
    <div class="edit">
      <label>Title</label><input class="e-title" type="text">
      <label>Time (max 99:59)</label>
      <div class="tm"><input class="e-min" type="number" inputmode="numeric" min="0" max="99" placeholder="min"><span>:</span><input class="e-sec" type="number" inputmode="numeric" min="0" max="59" placeholder="sec"></div>
      <button class="apply">Apply</button>
    </div>`;
  const q = (s) => el.querySelector(s);
  const card = { el, i, title: q(".t-title"), state: q(".t-state"), time: q(".time"), go: q(".go"), shown: null };
  q(".go").onclick = () => { buzz(); write({ [i]: togglePatch(timerAt(i)) }); };
  q(".reset").onclick = () => {
    if (timerAt(i).running && !confirm("Reset a running timer?")) return;
    buzz(); write({ [i]: resetPatch(timerAt(i)) });
  };
  el.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { buzz(); write({ [i]: adjustPatch(timerAt(i), Number(b.dataset.d)) }); }));
  q(".more").onclick = () => {
    const ed = q(".edit");
    if (!ed.classList.contains("open")) {
      const t = timerAt(i), r = clamp(Number(t.reset_seconds) || 0, 0, MAX);
      q(".e-title").value = t.title ?? "";
      q(".e-min").value = Math.floor(r / 60);
      q(".e-sec").value = r % 60;
    }
    ed.classList.toggle("open");
  };
  q(".apply").onclick = () => {
    const t = timerAt(i);
    const m = parseInt(q(".e-min").value || "0", 10), s = parseInt(q(".e-sec").value || "0", 10);
    const old = clamp(Number(t.reset_seconds) || 0, 0, MAX);
    const secs = (Number.isNaN(m) || Number.isNaN(s)) ? old : clamp(m * 60 + s, 0, MAX);
    const patch = { title: q(".e-title").value, reset_seconds: secs };
    if (secs !== old) Object.assign(patch, { running: false, started_at: null, base_seconds: secs, base_overtime: false });
    buzz(); write({ [i]: patch });
    q(".edit").classList.remove("open");
  };
  return card;
}

function ensureCards() {
  if (S.cards.length) return;
  S.cards = [0, 1, 2].map(buildCard);
  S.blocks = [0, 1, 2].map((i) => {
    const b = document.createElement("button");
    b.onclick = () => { buzz(); S.sel[i] = !S.sel[i]; renderAll(); };
    $("#blocks").appendChild(b);
    return b;
  });
  [1, 2, 3].forEach((n) => {
    const b = document.createElement("button");
    b.textContent = n; b.dataset.n = n;
    b.onclick = () => {
      buzz();
      const patches = {};
      for (let i = n; i < 3; i++) { const t = timerAt(i); if (t.running) patches[i] = togglePatch(t); }
      write(patches, { visible_count: n });
    };
    $("#count").appendChild(b);
  });
}

const selectedCards = () => S.cards.slice(0, S.count).filter((c) => S.sel[c.i]);

function renderAll() {
  const d = S.data;
  $("#wait").hidden = !!d;
  if (!d) { $("#list").innerHTML = ""; S.count = 0; return; }
  ensureCards();
  const count = clamp(Number(d.visible_count) || 1, 1, 3);
  if (S.count !== count) {
    S.count = count;
    const list = $("#list");
    list.innerHTML = "";
    S.cards.slice(0, count).forEach((c) => list.appendChild(c.el));
  }
  S.blocks.forEach((b, i) => {
    b.style.display = i < count ? "" : "none";
    b.textContent = timerAt(i).title ?? `Timer ${i + 1}`;
    b.classList.toggle("on", S.sel[i]);
  });
  document.querySelectorAll("#count button").forEach((b) => b.classList.toggle("on", Number(b.dataset.n) === count));
  S.cards.slice(0, count).forEach((c) => paint(c, true));
  const any = selectedCards().some((c) => timerAt(c.i).running);
  const m = $("#master");
  m.textContent = any ? "■ STOP SELECTED" : "▶ START SELECTED";
  m.classList.toggle("stop", any);
}

function paint(c, force) {
  const t = timerAt(c.i), v = compute(t);
  const key = v.total + (v.over ? "o" : "") + (t.running ? "r" : "");
  if (!force && key === c.shown) return;
  c.shown = key;
  const bg = t.bg_color || "#0f172a";
  const fg = v.over ? (t.stopwatch_color || "#ef4444") : (t.text_color || "#ffffff");
  c.el.style.background = bg;
  c.el.style.color = t.text_color || "#ffffff";
  c.el.classList.toggle("running", !!t.running);
  c.title.textContent = t.title ?? `Timer ${c.i + 1}`;
  c.state.textContent = v.over ? "Overtime" : t.running ? "Running" : "Paused";
  c.time.textContent = fmt(Math.min(v.total, MAX));
  c.time.style.color = fg;
  c.go.textContent = t.running ? "⏸ Pause" : "▶ Start";
  c.go.classList.toggle("run", !!t.running);
}

function join(code) {
  leave(true);
  S.code = code; S.data = null; S.count = 0;
  try { localStorage.setItem(SESSION_KEY, code); } catch (e) {}
  $("#join").classList.remove("open");
  $("#app").hidden = false;
  $("#code").textContent = code;
  const root = ref(db, "sessions/" + code);
  S.unsubs.push(onValue(ref(db, ".info/serverTimeOffset"), (s) => { S.offset = s.val() || 0; }));
  S.unsubs.push(onValue(ref(db, ".info/connected"), (s) => $("#dot").classList.toggle("ok", !!s.val())));
  S.unsubs.push(onValue(root, (snap) => { S.data = snap.val(); renderAll(); }, (err) => {
    showJoin(); $("#err").textContent = "Could not open the session: " + err.message;
  }));
  requestWake();
}

function leave(silent) {
  S.unsubs.forEach((u) => u()); S.unsubs = [];
  if (!silent) { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} showJoin(); }
}

function showJoin() {
  $("#join").classList.add("open");
  $("#app").hidden = true;
  $("#codeIn").value = S.code || "";
}

// keep the phone screen awake while controlling
let wake = null;
async function requestWake() {
  try { if ("wakeLock" in navigator && S.code) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") requestWake(); });

$("#joinForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("#codeIn").value.trim();
  if (!CODE_RE.test(v)) { $("#err").textContent = "Use 3–32 letters, numbers, - or _."; return; }
  $("#err").textContent = "";
  join(v);
});
$("#leave").onclick = () => leave();
$("#master").onclick = () => {
  const cards = selectedCards();
  if (!cards.length) return;
  buzz();
  const target = !cards.some((c) => timerAt(c.i).running);
  const patches = {};
  cards.forEach((c) => { const t = timerAt(c.i); if (!!t.running !== target) patches[c.i] = togglePatch(t); });
  write(patches);
};

setInterval(() => S.cards.slice(0, S.count).forEach((c) => paint(c, false)), 100);

const fromUrl = new URLSearchParams(location.search).get("s");
const saved = (() => { try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; } })();
const start = [fromUrl, saved].find((v) => v && CODE_RE.test(v));
if (start) join(start); else showJoin();
</script>
</body>
</html>
